name: Build Stalwart

# Tracks upstream Stalwart releases and publishes a slimmed-down image
# (no enterprise, only the features listed in FEATURES below) to GHCR.

on:
  schedule:
    # Poll upstream every 6 hours; a no-op unless there is a new release.
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream tag to build, e.g. v1.1.1 (blank = latest release)'
        required: false
        default: ''
      force:
        description: 'Rebuild even if this version has already been released here'
        type: boolean
        default: false

env:
  UPSTREAM: stalwartlabs/stalwart
  FEATURES: sqlite s3

concurrency:
  group: build-stalwart
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      is_latest: ${{ steps.check.outputs.is_latest }}
      build: ${{ steps.check.outputs.build }}
      image: ${{ steps.check.outputs.image }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          latest=$(gh api "repos/${UPSTREAM}/releases/latest" --jq .tag_name)
          version="${INPUT_VERSION:-$latest}"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Unexpected version tag '$version'"
            exit 1
          fi

          # A release in this repo is only created after a successful push,
          # so it doubles as the "already built" marker.
          build=true
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "${FORCE:-false}" = "true" ]; then
              echo "$version already released; forced rebuild requested"
            else
              echo "$version already released; nothing to do"
              build=false
            fi
          fi

          {
            echo "version=$version"
            echo "is_latest=$([ "$version" = "$latest" ] && echo true || echo false)"
            echo "build=$build"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64]
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Set arch
        run: echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          path: banksy

      - name: Checkout upstream ${{ env.VERSION }}
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ env.VERSION }}
          path: upstream

      - name: Patch upstream Dockerfile features
        run: banksy/scripts/patch-dockerfile.sh upstream/Dockerfile "$FEATURES"

      - name: Record upstream commit
        run: echo "UPSTREAM_SHA=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_ENV"

      # The Dockerfile cross-compiles Rust natively; QEMU is only needed for
      # the small apt/setcap steps in the arm64 runtime stage.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=banksy-stalwart
            org.opencontainers.image.description=Stalwart mail server (features: ${{ env.FEATURES }})
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ env.UPSTREAM_SHA }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.IMAGE }}-buildcache:${{ env.ARCH }}
          cache-to: type=registry,ref=${{ env.IMAGE }}-buildcache:${{ env.ARCH }},mode=max,image-manifest=true,oci-mediatypes=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.ARCH }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ needs.check.outputs.version }}
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ${{ needs.check.outputs.image }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pre-releases get only their exact version tag; stable releases also
      # get X.Y and, if they are upstream's latest, 'latest'.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=semver,pattern={{version}},value=${{ env.VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.VERSION }},enable=${{ needs.check.outputs.is_latest }}
            type=raw,value=latest,enable=${{ needs.check.outputs.is_latest }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ steps.meta.outputs.tags }}
          IS_LATEST: ${{ needs.check.outputs.is_latest }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists (forced rebuild); leaving it alone"
            exit 0
          fi
          notes=$(cat <<NOTES
          Stalwart [${VERSION}](https://github.com/${UPSTREAM}/releases/tag/${VERSION}) built with \`--no-default-features --features "${FEATURES}"\`.

          \`\`\`
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Image tags:
          $(sed 's/^/- `/; s/$/`/' <<< "$TAGS")
          NOTES
          )
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Stalwart ${VERSION} (${FEATURES})" \
            --notes "$notes" \
            --latest="$IS_LATEST" \
            "${prerelease[@]}"
